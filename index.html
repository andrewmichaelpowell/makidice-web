<!DOCTYPE html>

<!--
Maki Dice (Web)
github.com/andrewmichaelpowell
-->

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Maki Dice</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F05C22">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Maki Dice">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=6">

<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png?v=6">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png?v=6">
<style>
  :root {
    color-scheme: dark;
    --orange: #F05C22;
    --label: #FFFFFF;
    --secondary-bg: #1C1C1E;
    --bg: #000000;
    --button-text-on-secondary: #FFFFFF;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    height: 100%;
    margin: 0;
    overscroll-behavior: none;
  }

  body {
    background: var(--bg);
    color: var(--label);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
  }

  #app {
    width: 100%;
    max-width: 500px;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .pages {
    flex: 1;
    position: relative;
  }

  .screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    padding: 0 16px;
    padding-top: max(16px, env(safe-area-inset-top));
    visibility: hidden;
    pointer-events: none;
  }

  .screen.active {
    visibility: visible;
    pointer-events: auto;
  }

  .spacer {
    flex: 1;
  }

  .result {
    font-size: 48px;
    font-weight: 400;
    text-align: right;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: clip;
    line-height: 1.1;
  }

  .btn-row {
    display: flex;
    gap: 8px;
  }

  .group-gap {
    height: 32px;
    flex-shrink: 0;
  }

  .row-gap {
    height: 8px;
    flex-shrink: 0;
  }

  .label-row-gap {
    height: 4px;
    flex-shrink: 0;
  }

  button.tile {
    flex: 1;
    height: 50px;
    border: none;
    border-radius: 25px;
    font-size: 16px;
    font-weight: 500;
    font-family: inherit;
    color: var(--label);
    background: var(--secondary-bg);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 2px;
    overflow: hidden;
    white-space: nowrap;
    transition: filter 0.1s;
  }

  button.tile:active {
    filter: brightness(0.85);
  }

  button.tile.orange {
    background: var(--orange);
    color: #FFFFFF;
  }

  button.tile svg {
    display: block;
    fill: currentColor;
  }

  .label-row {
    display: flex;
    width: 100%;
  }

  .label-row .name {
    flex: 1 1 auto;
    font-size: 28px;
    text-align: left;
    white-space: nowrap;
    overflow: hidden;
  }

  .label-row .value {
    flex: 0 0 auto;
    font-size: 28px;
    text-align: right;
    white-space: nowrap;
    padding-left: 12px;
  }

  .chooser {
    position: relative;
    display: flex;
    flex-shrink: 0;
    padding: 4px;
    border-radius: 999px;
    background: var(--secondary-bg);
  }

  .chooser-indicator {
    position: absolute;
    top: 4px;
    bottom: 4px;
    left: 4px;
    width: calc((100% - 8px) / 2);
    border-radius: 999px;
    background: var(--orange);
    transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  .chooser[data-selected="1"] .chooser-indicator {
    transform: translateX(100%);
  }

  .chooser button {
    position: relative;
    flex: 1;
    border: none;
    background: none;
    padding: 0 8px;
    font-family: inherit;
    color: var(--label);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    white-space: nowrap;
    overflow: hidden;
  }

  .segment-chooser {
    height: 50px;
  }

  .segment-chooser button {
    font-size: 16px;
    font-weight: 500;
    opacity: 0.6;
    transition: color 0.25s, opacity 0.25s;
  }

  .segment-chooser button[aria-selected="true"] {
    color: #FFFFFF;
    opacity: 1;
  }

  .page-chooser-row {
    display: flex;
    justify-content: center;
    flex-shrink: 0;
    padding-bottom: max(16px, env(safe-area-inset-bottom));
  }

  .page-chooser button {
    width: 80px;
    height: 44px;
    font-size: 19px;
    font-weight: 600;
  }

  .page-chooser svg {
    display: block;
    fill: var(--label);
  }

  .number-pad {
    display: flex;
    flex-direction: column;
  }
</style>
</head>
<body>

<div id="app">
 <div class="pages">

  <!-- Main View -->

  <section id="screen-main" class="screen active">
    <div class="spacer"></div>

    <div id="main-result" class="result"></div>

    <div class="group-gap" style="height:16px"></div>

    <div class="number-pad">
      <div class="btn-row">
        <button class="tile" data-quick="4">1d4</button>
        <button class="tile" data-quick="6">1d6</button>
        <button class="tile" data-quick="8">1d8</button>
      </div>
      <div class="row-gap"></div>
      <div class="btn-row">
        <button class="tile" data-quick="10">1d10</button>
        <button class="tile" data-quick="12">1d12</button>
        <button class="tile" data-quick="20">1d20</button>
      </div>
      <div class="row-gap"></div>
      <div class="btn-row">
        <button class="tile orange" id="main-clear">Clear</button>
        <button class="tile" data-quick="100">1d100</button>
        <button class="tile orange" id="main-roll-quick">Roll</button>
      </div>
    </div>

    <div class="group-gap"></div>

    <div class="number-pad">
      <div class="btn-row">
        <button class="tile" data-digit="1">1</button>
        <button class="tile" data-digit="2">2</button>
        <button class="tile" data-digit="3">3</button>
      </div>
      <div class="row-gap"></div>
      <div class="btn-row">
        <button class="tile" data-digit="4">4</button>
        <button class="tile" data-digit="5">5</button>
        <button class="tile" data-digit="6">6</button>
      </div>
      <div class="row-gap"></div>
      <div class="btn-row">
        <button class="tile" data-digit="7">7</button>
        <button class="tile" data-digit="8">8</button>
        <button class="tile" data-digit="9">9</button>
      </div>
      <div class="row-gap"></div>
      <div class="btn-row">
        <button class="tile orange" id="main-d">d</button>
        <button class="tile" id="main-zero">0</button>
        <button class="tile orange" id="main-backspace" aria-label="Delete">
          <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M22 3H7c-.69 0-1.23.35-1.59.88L0 12l5.41 8.11c.36.53.9.89 1.59.89h15c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H7.07L2.4 12l4.66-7H22v14zm-11.59-2L14 13.41 17.59 17 19 15.59 15.41 12 19 8.41 17.59 7 14 10.59 10.41 7 9 8.41 12.59 12 9 15.59z"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="group-gap"></div>
  </section>

  <!-- D10 View -->

  <section id="screen-d10" class="screen">
    <div class="spacer"></div>

    <div class="label-row">
      <div class="name">Dice</div>
      <div class="value" id="d10-dice-value"></div>
    </div>
    <div class="label-row-gap"></div>
    <div class="label-row">
      <div class="name">Difficulty</div>
      <div class="value" id="d10-difficulty-value"></div>
    </div>
    <div class="label-row-gap"></div>
    <div class="label-row">
      <div class="name">Successes</div>
      <div class="value" id="d10-successes-value"></div>
    </div>

    <div style="height:16px; flex-shrink:0;"></div>

    <div class="chooser segment-chooser" id="d10-chooser" role="tablist" data-selected="0">
      <div class="chooser-indicator"></div>
      <button role="tab" id="d10-select-dice" aria-selected="true">Dice</button>
      <button role="tab" id="d10-select-difficulty" aria-selected="false">Difficulty</button>
    </div>

    <div class="group-gap"></div>

    <div class="number-pad">
      <div class="btn-row">
        <button class="tile" data-pool="1">1</button>
        <button class="tile" data-pool="2">2</button>
        <button class="tile" data-pool="3">3</button>
      </div>
      <div class="row-gap"></div>
      <div class="btn-row">
        <button class="tile" data-pool="4">4</button>
        <button class="tile" data-pool="5">5</button>
        <button class="tile" data-pool="6">6</button>
      </div>
      <div class="row-gap"></div>
      <div class="btn-row">
        <button class="tile" data-pool="7">7</button>
        <button class="tile" data-pool="8">8</button>
        <button class="tile" data-pool="9">9</button>
      </div>
      <div class="row-gap"></div>
      <div class="btn-row">
        <button class="tile orange" id="d10-clear">Clear</button>
        <button class="tile" data-pool="10">10</button>
        <button class="tile orange" id="d10-roll">Roll</button>
      </div>
    </div>

    <div class="group-gap"></div>
  </section>

 </div>

  <div class="page-chooser-row">
    <div class="chooser page-chooser" id="page-chooser" role="tablist" data-selected="0">
      <div class="chooser-indicator"></div>
      <button role="tab" id="page-main" aria-label="Calculator" aria-selected="true">
        <svg width="26" height="26" viewBox="158 159.2 708 708" aria-hidden="true">
          <path d="M308.88 618.92 L512 266.83 L715.12 618.92 Z M481.53 261.6 L288.41 596.37 L210.27 332.08 Z M813.73 332.08 L735.59 596.37 L542.47 261.6 Z M512 867.16 L316.53 647.92 L707.47 647.92 Z M291.79 280.94 L497.5 159.24 L497.5 227.49 Z M526.5 227.49 L526.5 159.24 L732.21 280.94 Z M206.25 671.71 L206.25 420.77 L267.35 627.44 Z M756.65 627.44 L817.75 420.77 L817.75 671.71 Z M437.38 827.04 L219.05 698.25 L281.93 652.69 Z M742.07 652.69 L804.95 698.25 L586.62 827.04 Z"/>
        </svg>
      </button>
      <button role="tab" id="page-d10" aria-selected="false">D10</button>
    </div>
  </div>

</div>

<script>
(function () {
  "use strict";
  const REVEAL_DELAY = 100;

  function randInt(min, max) { 
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function setChooser(chooser, index) {
    chooser.dataset.selected = String(index);
    chooser.querySelectorAll("button").forEach((btn, i) => {
      btn.setAttribute("aria-selected", String(i === index));
    });
  }

  (function initPageChooser() {
    const chooser = document.getElementById("page-chooser");
    const screens = ["screen-main", "screen-d10"];

    function showPage(index) {
      screens.forEach((id, i) => {
        document.getElementById(id).classList.toggle("active", i === index);
      });
      setChooser(chooser, index);
    }

    function selectPage(index) {
      showPage(index);
      try { localStorage.setItem("SelectedTab", String(index)); } catch (e) {}
    }

    let saved = 0;
    try { saved = localStorage.getItem("SelectedTab") === "1" ? 1 : 0; } catch (e) {}
    showPage(saved);

    document.getElementById("page-main").addEventListener("click", () => selectPage(0));
    document.getElementById("page-d10").addEventListener("click", () => selectPage(1));
  })();

  // Main View

  (function initMainView() {
    let diceNumber = "";
    let diceType = "";
    let editSide = 1;
    let resetInput = 1;
    let resultValue = 0;

    const resultEl = document.getElementById("main-result");

    function revealAfterDelay(value) {
      resultEl.textContent = "";
      setTimeout(() => { resultEl.textContent = value; }, REVEAL_DELAY);
    }

    function quickRoll(sides) {
      resultValue = randInt(1, sides);
      editSide = 1;
      resetInput = 1;
      diceNumber = "1";
      diceType = String(sides);
      revealAfterDelay(String(resultValue));
    }

    function clear() {
      editSide = 1;
      diceNumber = "";
      diceType = "";
      resultEl.textContent = "";
    }

    function setRight(v) {
      if (diceType.length < 3) {
        diceType += String(v);
        resultEl.textContent = diceNumber + "d" + diceType;
      }
    }

    function setLeft(v) {
      if (resetInput === 1) {
        diceNumber = "";
        diceType = "";
        resetInput = 0;
      }
      if (diceNumber.length < 3) {
        diceNumber += String(v);
        resultEl.textContent = diceNumber;
      }
    }

    function appendDigit(v) {
      if (editSide === 1) setLeft(v);
      if (editSide === 2) setRight(v);
    }

    function zero() {
      if (editSide === 1 && diceNumber !== "" && resetInput === 0) appendDigit(0);
      if (editSide === 2 && diceType !== "" && resetInput === 0) appendDigit(0);
    }

    function pressD() {
      if (editSide === 1 && resetInput === 0) {
        editSide = 2;
        resultEl.textContent = diceNumber + "d";
      }
    }

    function backspace() {
      if (resetInput !== 0) return;
      if (editSide === 2) {
        if (diceType === "") {
          editSide = 1;
          resultEl.textContent = diceNumber;
        } else {
          diceType = diceType.slice(0, -1);
          resultEl.textContent = diceNumber + "d" + diceType;
        }
      } else if (diceNumber !== "") {
        diceNumber = diceNumber.slice(0, -1);
        resultEl.textContent = diceNumber;
        if (diceNumber === "") resetInput = 1;
      }
    }

    function roll() {
      if (diceNumber !== "" && diceType !== "") {
        const n = parseInt(diceNumber, 10);
        const sides = parseInt(diceType, 10);
        let total = 0;
        for (let i = 0; i < n; i++) total += randInt(1, sides);
        resultValue = total;
        revealAfterDelay(String(resultValue));
        editSide = 1;
        resetInput = 1;
      }
    }

    document.querySelectorAll("[data-quick]").forEach(btn => {
      btn.addEventListener("click", () => quickRoll(parseInt(btn.dataset.quick, 10)));
    });
    document.querySelectorAll("#screen-main [data-digit]").forEach(btn => {
      btn.addEventListener("click", () => appendDigit(parseInt(btn.dataset.digit, 10)));
    });
    document.getElementById("main-clear").addEventListener("click", clear);
    document.getElementById("main-zero").addEventListener("click", zero);
    document.getElementById("main-d").addEventListener("click", pressD);
    document.getElementById("main-backspace").addEventListener("click", backspace);
    document.getElementById("main-roll-quick").addEventListener("click", roll);
  })();

  // D10 View
  
  (function initD10View() {
    let diceValue = 0;
    let difficultyValue = 0;
    let successesValue = 0;
    let selected = 1;

    const diceValueEl = document.getElementById("d10-dice-value");
    const difficultyValueEl = document.getElementById("d10-difficulty-value");
    const successesValueEl = document.getElementById("d10-successes-value");
    const chooser = document.getElementById("d10-chooser");
    const selectDiceBtn = document.getElementById("d10-select-dice");
    const selectDifficultyBtn = document.getElementById("d10-select-difficulty");

    function updateSelectionStyles() {
      setChooser(chooser, selected - 1);
    }

    function clear() {
      diceValue = 0;
      difficultyValue = 0;
      successesValue = 0;
      diceValueEl.textContent = "";
      difficultyValueEl.textContent = "";
      successesValueEl.textContent = "";
     }

    function addValueToSide(v) {
      if (selected === 1) {
        diceValue = v;
        diceValueEl.textContent = String(diceValue);
      }
      if (selected === 2) {
        difficultyValue = v;
        difficultyValueEl.textContent = String(difficultyValue);
      }
    }

    function roll() {
      if (diceValue !== 0 && difficultyValue !== 0) {
        let successes = 0;
        for (let i = 0; i < diceValue; i++) {
          const r = randInt(1, 10);
          if (r === 1) successes -= 1;
          else if (r === 10) successes += 2;
          else if (r >= difficultyValue) successes += 1;
        }
        successesValue = successes;
        successesValueEl.textContent = "";
        setTimeout(() => { successesValueEl.textContent = String(successesValue); }, REVEAL_DELAY);
      }
    }

    selectDiceBtn.addEventListener("click", () => { selected = 1; updateSelectionStyles(); });
    selectDifficultyBtn.addEventListener("click", () => { selected = 2; updateSelectionStyles(); });
    document.querySelectorAll("[data-pool]").forEach(btn => {
      btn.addEventListener("click", () => addValueToSide(parseInt(btn.dataset.pool, 10)));
    });
    document.getElementById("d10-clear").addEventListener("click", clear);
    document.getElementById("d10-roll").addEventListener("click", roll);

    updateSelectionStyles();
  })();

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch((err) => {
        console.warn("Service worker registration failed:", err);
      });
    });
  }
})();
</script>

</body>
</html>
